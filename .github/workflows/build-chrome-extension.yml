name: Build Chrome extension

on:
  push:
    branches: [main]
    paths:
      - 'chrome-extension/**'
      - 'public/logo-mark.png'
      - 'public/icon-192x192.png'
      - '.github/workflows/build-chrome-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build Chrome Web Store package and assets
        run: python chrome-extension/tools/build_store_assets.py
      - name: Validate manifest
        run: python -m json.tool chrome-extension/manifest.json >/dev/null
      - name: Upload ready-to-submit package
        uses: actions/upload-artifact@v4
        with:
          name: business-reviews-ai-chrome-store
          path: dist/chrome-extension/
          if-no-files-found: error
