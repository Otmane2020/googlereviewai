name: Build Android app (Play Store)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (entier, à incrémenter à chaque envoi sur Play Store)'
        required: false
      version_name:
        description: 'versionName (ex: 1.0.1)'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : l'AAB ne sera pas signé (non accepté par le Play Store)."
          fi

      - name: Build release AAB and debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleDebug

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: googlereviewai-play-store-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload debug APK (test sur téléphone)
        uses: actions/upload-artifact@v4
        with:
          name: googlereviewai-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
