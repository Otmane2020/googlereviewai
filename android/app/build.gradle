plugins {
    id "com.android.application"
}

// Web origin wrapped by the Trusted Web Activity.
def twaHost = "googlereviewai.com"
def twaLaunchUrl = "https://googlereviewai.com/?utm_source=android_app"

// Release signing comes from env vars (CI) — see android/README.md.
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "com.googlereviewai.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.googlereviewai.app"
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0.0"

        manifestPlaceholders = [
            hostName: twaHost,
            launchUrl: twaLaunchUrl,
        ]
        resValue "string", "launchUrl", twaLaunchUrl
        resValue "string", "hostName", twaHost
    }

    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        resValues true
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
    implementation "com.google.androidbrowserhelper:billing:1.2.0"
}
